# Bloc commun : conteneur node jetable, code monté depuis l'hôte,
# fichiers créés avec l'UID/GID de l'hôte (passés par le Makefile).
x-node: &node
  image: ${NODE_IMAGE:-node:22-bookworm-slim}
  working_dir: /app
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  environment:
    HOME: /tmp
  env_file: .env.local
  volumes:
    - .:/app

services:
  # Serveur de dev Next.js — `make dev` ou `docker compose up`
  app:
    <<: *node
    volumes:
      # .next vit dans un volume nommé : le cache Turbopack se corrompt sur le
      # bind mount partagé avec l'hôte (panics au Fast Refresh, manifests perdus).
      - .:/app
      - next-cache:/app/.next
    ports:
      - "3000:3000"
    # Le rm purge un éventuel verrou orphelin (conteneur tué sans arrêt propre).
    command: sh -c "rm -rf .next/dev/lock && npm run dev -- -H 0.0.0.0"

  # PostgreSQL local + proxy Neon HTTP — dev sans compte Neon (`make db-up`).
  # L'app garde le driver @neondatabase/serverless : en dev, DATABASE_URL
  # pointe vers le proxy (port 4444) ; en prod, vers Neon (inchangé).
  postgres:
    image: postgres:17-alpine
    profiles: [db]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: main
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    profiles: [db]
    environment:
      PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/main
    ports:
      - "4444:4444"
    depends_on:
      postgres:
        condition: service_healthy

  # Drizzle Studio — `make db-studio`, puis ouvrir https://local.drizzle.studio
  studio:
    <<: *node
    profiles: [tools]
    ports:
      - "4983:4983"
    command: npx drizzle-kit studio --host 0.0.0.0

  # Tests e2e Playwright (lance son propre serveur Next sur :3030).
  # Le navigateur est téléchargé à la version exacte de @playwright/test,
  # puis mis en cache dans le volume pw-cache.
  e2e:
    image: ${PLAYWRIGHT_IMAGE:-mcr.microsoft.com/playwright:v1.49.1-noble}
    profiles: [test]
    working_dir: /app
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      HOME: /tmp
    env_file: .env.local
    volumes:
      - .:/app
      - pw-cache:/tmp/.cache
    ipc: host
    command: sh -c "npx playwright install chromium && npx playwright test"

volumes:
  next-cache:
  pw-cache:
  pg-data:
